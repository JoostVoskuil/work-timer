# XcodeGen spec (https://github.com/yonaskolb/XcodeGen). Requires full Xcode and an Apple Developer team.
# Generates an Xcode project wrapping the SwiftPM core with the app, Safari extension and widget targets, all in one App Group.
name: WorkTimer
options: { deploymentTarget: { macOS: "13.0" } }
packages:
  WorkTimer: { path: .. }
settings: { base: { SWIFT_VERSION: "6.0", MARKETING_VERSION: "1.0", CURRENT_PROJECT_VERSION: "1" } }
targets:
  WorkTimer:
    type: application
    platform: macOS
    sources: [../Sources/WorkTimerApp]
    dependencies: [{ package: WorkTimer, product: WorkTimerCore }, { target: SafariExtension }, { target: Widgets }]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: nl.worktimer.app } }
    info:
      path: App-Info.plist
      properties: { LSUIElement: true, CFBundleDisplayName: WorkTimer, CFBundleIconFile: WorkTimer }
    entitlements: { path: App.entitlements, properties: { com.apple.security.application-groups: [group.nl.worktimer.shared] } }
  SafariExtension:
    type: app-extension
    platform: macOS
    sources: [SafariExtension]
    dependencies: [{ package: WorkTimer, product: WorkTimerCore }]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: nl.worktimer.app.safari } }
    info:
      path: Safari-Info.plist
      properties:
        CFBundleDisplayName: WorkTimer Safari
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements: { path: Safari.entitlements, properties: { com.apple.security.app-sandbox: true, com.apple.security.application-groups: [group.nl.worktimer.shared] } }
  Widgets:
    type: app-extension
    platform: macOS
    sources: [Widgets]
    dependencies: [{ package: WorkTimer, product: WorkTimerCore }]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: nl.worktimer.app.widgets } }
    info:
      path: Widgets-Info.plist
      properties:
        CFBundleDisplayName: WorkTimer Widgets
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements: { path: Widgets.entitlements, properties: { com.apple.security.app-sandbox: true, com.apple.security.application-groups: [group.nl.worktimer.shared] } }
